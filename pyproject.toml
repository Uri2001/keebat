[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keebat"
version = "0.1.0"
description = "ZMK split keyboard battery monitor for KDE Plasma system tray"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PyQt6>=6.6",
    "bleak>=0.22",
    "dbus-fast>=2.0",
]

[project.scripts]
keebat = "keebat.__main__:main"
